<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>JARVIS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100vw;height:100vh;
  background:#000;overflow:hidden;
  font-family:'Rajdhani','Courier New',monospace;
  -webkit-app-region:drag;
  user-select:none;
  cursor:none;
}
canvas{
  position:fixed;top:0;left:0;
  width:100%;height:100%;
  -webkit-app-region:no-drag;
}

/* ═══ Custom cursor ═══════════════════════════════════════════ */
#cursor{
  position:fixed;width:24px;height:24px;
  border:1px solid rgba(180,80,255,.8);
  border-radius:50%;
  pointer-events:none;z-index:9999;
  transform:translate(-50%,-50%);
  transition:transform .15s,border-color .2s,width .2s,height .2s;
  box-shadow:0 0 18px rgba(170,0,255,.55);
}
#cursor::after{
  content:'';position:absolute;inset:50%;
  width:3px;height:3px;margin:-1.5px 0 0 -1.5px;
  background:#cc66ff;border-radius:50%;
  box-shadow:0 0 10px #cc66ff;
}

/* ═══ Top bar ════════════════════════════════════════════════ */
#topbar{
  position:fixed;top:0;left:0;right:0;height:58px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 32px;
  background:linear-gradient(180deg,rgba(5,0,20,.95) 0%,rgba(5,0,14,.25) 100%);
  border-bottom:1px solid rgba(140,0,255,.25);
  z-index:10;pointer-events:none;
  backdrop-filter:blur(6px);
}
#logo{display:flex;align-items:center;gap:14px}
#logo-dot{
  width:10px;height:10px;border-radius:50%;
  background:radial-gradient(#ff55ff,#9900ff);
  box-shadow:
    0 0 14px #9900ff,
    0 0 32px rgba(180,50,255,.6),
    0 0 60px rgba(200,0,255,.35);
  animation:blink-dot 1.6s ease-in-out infinite;
}
@keyframes blink-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.85)}}
#logo-text{
  font-size:16px;letter-spacing:9px;color:#d388ff;font-weight:700;
  text-shadow:0 0 20px rgba(200,80,255,.7),0 0 40px rgba(180,0,255,.3);
}
#top-center{
  position:absolute;left:50%;transform:translateX(-50%);
  font-size:11px;letter-spacing:5px;
  color:rgba(200,130,255,.7);
  text-shadow:0 0 14px rgba(160,0,255,.5);
  font-weight:600;
}
#top-right{display:flex;align-items:center;gap:20px}
#state-badge{
  font-size:10px;letter-spacing:3px;padding:5px 14px;
  background:rgba(140,0,255,.15);
  border:1px solid rgba(170,50,255,.5);
  color:#dd99ff;font-weight:700;
  box-shadow:inset 0 0 12px rgba(170,0,255,.15),0 0 8px rgba(140,0,255,.2);
  clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);
}
#top-time{
  font-size:13px;letter-spacing:3px;color:#dd99ff;font-weight:600;
  text-shadow:0 0 10px rgba(160,0,255,.6);
  font-variant-numeric:tabular-nums;
}

/* ═══ HUD side widgets ═══════════════════════════════════════ */
.hud-widget{
  position:fixed;
  background:linear-gradient(135deg,rgba(30,0,60,.35),rgba(10,0,25,.55));
  border:1px solid rgba(140,0,255,.35);
  backdrop-filter:blur(8px);
  padding:10px 14px;
  color:#d0a0ff;font-size:10px;letter-spacing:2px;
  z-index:11;pointer-events:none;
  box-shadow:
    inset 0 0 20px rgba(120,0,220,.1),
    0 0 14px rgba(130,0,220,.2);
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
}
.hud-widget h4{
  font-size:9px;letter-spacing:4px;color:#bb66ff;font-weight:700;
  margin-bottom:6px;padding-bottom:4px;
  border-bottom:1px solid rgba(150,0,255,.25);
}
.hud-widget .row{
  display:flex;justify-content:space-between;gap:12px;line-height:1.6;
  font-variant-numeric:tabular-nums;
}
.hud-widget .row span:last-child{color:#f0d0ff;font-weight:600}

#hud-left-1{top:78px;left:16px;width:200px}
#hud-left-2{top:260px;left:16px;width:200px}
#hud-right-1{top:78px;right:16px;width:220px}
#hud-right-2{top:260px;right:16px;width:220px}

.bar-meter{
  width:100%;height:4px;
  background:rgba(60,0,120,.4);margin-top:3px;
  position:relative;overflow:hidden;
}
.bar-meter .fill{
  position:absolute;left:0;top:0;height:100%;
  background:linear-gradient(90deg,#6b00bf,#cc33ff,#ff66ff);
  box-shadow:0 0 6px rgba(200,50,255,.8);
  transition:width .3s;
}

/* ═══ Data streams ═══════════════════════════════════════════ */
.datastream{
  position:fixed;top:70px;bottom:130px;width:14px;
  overflow:hidden;pointer-events:none;z-index:3;
  font-size:10px;letter-spacing:0;
  color:rgba(170,60,255,.35);
  text-align:center;line-height:1.15;
  font-family:'Courier New',monospace;
  white-space:pre;
  mask-image:linear-gradient(180deg,transparent 0%,black 15%,black 85%,transparent 100%);
}
.datastream div{animation:stream-fall 14s linear infinite}
@keyframes stream-fall{from{transform:translateY(-50%)}to{transform:translateY(0%)}}
#ds-left-1{left:230px;animation-delay:0s}
#ds-left-2{left:250px}
#ds-right-1{right:245px}
#ds-right-2{right:265px}

/* ═══ Conversation panel ═════════════════════════════════════ */
#conv{
  position:fixed;bottom:64px;left:0;right:0;height:22%;
  background:linear-gradient(180deg,transparent 0%,rgba(5,0,18,.8) 20%,rgba(5,0,18,.95) 100%);
  border-top:1px solid rgba(130,0,240,.18);
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:14px 40px 20px;
  z-index:10;pointer-events:none;overflow:hidden;
}
.msg{
  display:flex;gap:16px;align-items:flex-start;
  opacity:0;
  animation:msg-in .55s cubic-bezier(.22,.68,0,1.15) forwards;
  margin-bottom:10px;flex-shrink:0;
}
@keyframes msg-in{
  from{opacity:0;transform:translateY(14px) scale(.98)}
  to  {opacity:1;transform:none}
}
.msg-role{
  font-size:9px;letter-spacing:2.5px;
  min-width:60px;padding-top:3px;
  font-weight:700;white-space:nowrap;
}
.msg-role.jarvis{color:#bb55ff;text-shadow:0 0 12px #aa33ff}
.msg-role.sir   {color:#ee99ff;text-shadow:0 0 12px #dd77ff}
.msg-text{
  font-size:14px;line-height:1.65;
  color:#e8c5ff;word-break:break-word;
  text-shadow:0 0 6px rgba(180,80,255,.15);
}
.msg.old{opacity:.35}
.msg.old .msg-text{color:#4a2670}

#typing{display:none;align-items:center;gap:8px;margin-bottom:12px}
#typing.on{display:flex}
.td{
  width:6px;height:6px;border-radius:50%;
  background:#bb00ff;
  box-shadow:0 0 10px #aa00ff;
  animation:tdb .9s ease infinite;
}
.td:nth-child(2){animation-delay:.16s}
.td:nth-child(3){animation-delay:.32s}
@keyframes tdb{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-7px)}}
#typing-label{
  font-size:10px;letter-spacing:4px;color:rgba(170,40,230,.75);
  font-weight:600;
}

/* ═══ Chat input bar ═════════════════════════════════════════ */
#chatbar{
  position:fixed;bottom:0;left:0;right:0;height:56px;
  display:flex;align-items:center;gap:12px;
  padding:0 24px;
  background:linear-gradient(180deg,rgba(8,0,22,.85),rgba(3,0,12,.98));
  border-top:1px solid rgba(140,0,255,.3);
  z-index:20;pointer-events:auto;
  backdrop-filter:blur(12px);
  box-shadow:0 -4px 20px rgba(100,0,200,.15);
}
#chatbar input{
  flex:1;height:38px;
  background:rgba(80,0,160,.1);
  border:1px solid rgba(150,0,255,.35);
  border-radius:6px;
  color:#e8c5ff;font-family:inherit;font-size:14px;font-weight:500;
  padding:0 16px;outline:none;letter-spacing:.5px;
  transition:border-color .2s,box-shadow .2s;
}
#chatbar input:focus{
  border-color:#bb44ff;
  box-shadow:0 0 16px rgba(180,40,255,.35),inset 0 0 8px rgba(140,0,255,.08);
}
#chatbar input::placeholder{color:rgba(170,110,255,.4);font-size:12px;letter-spacing:2px}
#chatbar button{
  width:40px;height:40px;border-radius:50%;border:none;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .2s;flex-shrink:0;
  position:relative;
}
#btn-send{
  background:linear-gradient(135deg,rgba(140,0,255,.5),rgba(200,0,255,.35));
  color:#f0d0ff;
  box-shadow:0 0 12px rgba(170,0,255,.35),inset 0 0 6px rgba(255,180,255,.15);
}
#btn-send:hover{
  background:linear-gradient(135deg,rgba(180,0,255,.7),rgba(230,0,255,.5));
  box-shadow:0 0 22px rgba(200,50,255,.6);
  transform:scale(1.05);
}
#btn-mic{
  background:rgba(80,0,160,.3);color:#c59aff;
  border:1px solid rgba(140,0,255,.3);
}
#btn-mic:hover{background:rgba(130,0,220,.45);transform:scale(1.05)}
#btn-mic.recording{
  background:radial-gradient(circle,rgba(255,40,120,.8),rgba(200,0,80,.5));
  color:#fff;animation:mic-pulse 1s ease infinite;
}
@keyframes mic-pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(255,40,120,.5),0 0 20px rgba(255,60,150,.4)}
  50%{box-shadow:0 0 0 14px rgba(255,40,120,0),0 0 30px rgba(255,80,180,.6)}
}

/* ═══ Audio-reactive bar ═════════════════════════════════════ */
#listen-bar{
  position:fixed;bottom:56px;left:0;height:2px;width:0%;
  background:linear-gradient(90deg,transparent,#8800ff 20%,#cc44ff 50%,#ff66ff 80%,transparent);
  transition:width .05s;pointer-events:none;z-index:21;
  box-shadow:0 0 8px rgba(200,80,255,.8);
}

/* ═══ Corner brackets ════════════════════════════════════════ */
.brk{
  position:fixed;width:32px;height:32px;
  border-color:rgba(140,20,255,.55);border-style:solid;
  pointer-events:none;z-index:5;
  filter:drop-shadow(0 0 6px rgba(160,0,240,.4));
}
.brk.tl{top:68px;left:14px;  border-width:2px 0 0 2px}
.brk.tr{top:68px;right:14px; border-width:2px 2px 0 0}
.brk.bl{bottom:68px;left:14px;  border-width:0 0 2px 2px}
.brk.br{bottom:68px;right:14px; border-width:0 2px 2px 0}

/* ═══ CRT + scan effects ═════════════════════════════════════ */
#crt{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:repeating-linear-gradient(
    0deg,transparent,transparent 2px,
    rgba(5,0,18,.06) 2px,rgba(5,0,18,.06) 4px);
  pointer-events:none;z-index:15;
  mix-blend-mode:multiply;
}
#vignette{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.6) 100%);
  pointer-events:none;z-index:16;
}
#scan{
  position:fixed;top:0;left:0;width:100%;height:2px;
  background:linear-gradient(90deg,transparent,rgba(200,80,255,.55) 50%,transparent);
  pointer-events:none;z-index:14;
  box-shadow:0 0 20px rgba(180,40,255,.5);
  animation:scan-down 8s linear infinite;
}
@keyframes scan-down{from{top:0}to{top:100%}}

/* ═══ Center targeting reticle ═══════════════════════════════ */
#reticle{
  position:fixed;top:50%;left:50%;
  width:280px;height:280px;margin:-140px 0 0 -140px;
  pointer-events:none;z-index:6;
  opacity:.4;mix-blend-mode:screen;
}
#reticle svg{width:100%;height:100%;animation:reticle-spin 45s linear infinite}
@keyframes reticle-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
#reticle circle,#reticle path,#reticle line{
  stroke:rgba(190,80,255,.6);fill:none;
  filter:drop-shadow(0 0 4px rgba(180,40,255,.5));
}
</style>
</head>
<body>

<div id="cursor"></div>

<div id="topbar">
  <div id="logo">
    <div id="logo-dot"></div>
    <span id="logo-text">J·A·R·V·I·S</span>
  </div>
  <span id="top-center">SYSTEM ONLINE</span>
  <div id="top-right">
    <span id="state-badge">STANDBY</span>
    <span id="top-time">--:--:--</span>
  </div>
</div>

<canvas id="c"></canvas>

<!-- HUD Widgets -->
<div class="hud-widget" id="hud-left-1">
  <h4>◆ REACTOR</h4>
  <div class="row"><span>OUTPUT</span><span id="w-output">100%</span></div>
  <div class="bar-meter"><div class="fill" id="bar-output" style="width:100%"></div></div>
  <div class="row"><span>FREQ</span><span id="w-freq">2.4 GHz</span></div>
  <div class="row"><span>TEMP</span><span id="w-temp">36.2°C</span></div>
</div>
<div class="hud-widget" id="hud-left-2">
  <h4>◆ NEURAL NET</h4>
  <div class="row"><span>LOAD</span><span id="w-load">--</span></div>
  <div class="bar-meter"><div class="fill" id="bar-load" style="width:20%"></div></div>
  <div class="row"><span>LATENCY</span><span id="w-latency">12ms</span></div>
  <div class="row"><span>STATE</span><span id="w-state">IDLE</span></div>
</div>
<div class="hud-widget" id="hud-right-1">
  <h4>◆ TELEMETRY</h4>
  <div class="row"><span>COORD</span><span id="w-coord">0.000° / 0.000°</span></div>
  <div class="row"><span>ALT</span><span id="w-alt">0 m</span></div>
  <div class="row"><span>VEC</span><span id="w-vec">[0,0,0]</span></div>
  <div class="row"><span>UPTIME</span><span id="w-uptime">00:00:00</span></div>
</div>
<div class="hud-widget" id="hud-right-2">
  <h4>◆ AUDIO</h4>
  <div class="row"><span>INPUT</span><span id="w-audio-in">0%</span></div>
  <div class="bar-meter"><div class="fill" id="bar-audio" style="width:0%"></div></div>
  <div class="row"><span>CHANNEL</span><span>MIC-01</span></div>
  <div class="row"><span>QUALITY</span><span>48 kHz</span></div>
</div>

<!-- Data streams -->
<div class="datastream" id="ds-left-1"><div id="dsc-l1"></div></div>
<div class="datastream" id="ds-left-2"><div id="dsc-l2"></div></div>
<div class="datastream" id="ds-right-1"><div id="dsc-r1"></div></div>
<div class="datastream" id="ds-right-2"><div id="dsc-r2"></div></div>

<!-- Center reticle -->
<div id="reticle">
  <svg viewBox="-150 -150 300 300">
    <circle cx="0" cy="0" r="140" stroke-width="1" stroke-dasharray="4 8"/>
    <circle cx="0" cy="0" r="110" stroke-width=".7" stroke-dasharray="2 14"/>
    <circle cx="0" cy="0" r="80" stroke-width=".5" stroke-dasharray="10 4"/>
    <line x1="-145" y1="0" x2="-120" y2="0" stroke-width="1.5"/>
    <line x1="145" y1="0" x2="120" y2="0" stroke-width="1.5"/>
    <line x1="0" y1="-145" x2="0" y2="-120" stroke-width="1.5"/>
    <line x1="0" y1="145" x2="0" y2="120" stroke-width="1.5"/>
    <path d="M -20 -100 L 0 -112 L 20 -100" stroke-width="1"/>
    <path d="M 100 -20 L 112 0 L 100 20" stroke-width="1"/>
  </svg>
</div>

<div id="conv">
  <div id="typing">
    <span class="td"></span><span class="td"></span><span class="td"></span>
    <span id="typing-label">VERARBEITE</span>
  </div>
</div>

<div id="chatbar">
  <button id="btn-mic" title="Mikrofon">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="9" y="1" width="6" height="13" rx="3"/>
      <path d="M5 10a7 7 0 0014 0"/><line x1="12" y1="21" x2="12" y2="17"/>
    </svg>
  </button>
  <input type="text" id="chat-input" placeholder="Nachricht an JARVIS …" autocomplete="off"/>
  <button id="btn-send" title="Senden">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
    </svg>
  </button>
</div>

<div id="listen-bar"></div>
<div class="brk tl"></div><div class="brk tr"></div>
<div class="brk bl"></div><div class="brk br"></div>
<div id="crt"></div>
<div id="vignette"></div>
<div id="scan"></div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer }   from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }       from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass }  from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }       from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass }       from 'three/addons/postprocessing/ShaderPass.js';
import { FilmPass }         from 'three/addons/postprocessing/FilmPass.js';

// ══════════════════════════════════════════════════════════════════════════════
//  State
// ══════════════════════════════════════════════════════════════════════════════
let STATE='idle', LEVEL=0, BARS=new Array(28).fill(0), MSGS=[], USERNAME='';
let sL=0;  // smoothed level

// ══════════════════════════════════════════════════════════════════════════════
//  Renderer + scene
// ══════════════════════════════════════════════════════════════════════════════
const cv=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:false,powerPreference:'high-performance'});
R.setPixelRatio(window.devicePixelRatio);
R.setSize(innerWidth,innerHeight);
R.toneMapping=THREE.ACESFilmicToneMapping;
R.toneMappingExposure=.92;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x030010);
scene.fog=new THREE.FogExp2(0x050015, 0.022);

const cam=new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 300);
cam.position.set(0, 2.2, 16);
cam.lookAt(0, 0, 0);

// ══════════════════════════════════════════════════════════════════════════════
//  Lighting — rich PBR
// ══════════════════════════════════════════════════════════════════════════════
scene.add(new THREE.AmbientLight(0x1a0033, 0.55));

const keyLight = new THREE.PointLight(0xcc55ff, 40, 60, 2);
keyLight.position.set(4, 5, 5);
scene.add(keyLight);

const fillLight = new THREE.PointLight(0x6600ff, 28, 50, 2);
fillLight.position.set(-5, 3, 4);
scene.add(fillLight);

const rimLight = new THREE.PointLight(0xff66ff, 22, 40, 2);
rimLight.position.set(0, 4, -5);
scene.add(rimLight);

const underLight = new THREE.PointLight(0x4400aa, 16, 30, 2);
underLight.position.set(0, -4, 3);
scene.add(underLight);

// ══════════════════════════════════════════════════════════════════════════════
//  Arc Reactor Core — custom shader with fresnel + pulsing
// ══════════════════════════════════════════════════════════════════════════════
const coreUniforms = {
  uTime:  {value: 0.0},
  uLevel: {value: 0.0},
  uColorInner: {value: new THREE.Color(0xff99ff)},
  uColorOuter: {value: new THREE.Color(0x5500ff)},
};

const coreMat = new THREE.ShaderMaterial({
  uniforms: coreUniforms,
  transparent: true,
  side: THREE.DoubleSide,
  vertexShader: `
    varying vec3 vNormal;
    varying vec3 vWorldPos;
    uniform float uTime;
    uniform float uLevel;
    void main(){
      vNormal = normalize(normalMatrix * normal);
      vec4 mv = modelViewMatrix * vec4(position,1.0);
      vWorldPos = (modelMatrix * vec4(position,1.0)).xyz;
      // subtle breathing
      vec3 pos = position * (1.0 + 0.04*sin(uTime*1.8) + uLevel*0.08);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(pos,1.0);
    }
  `,
  fragmentShader: `
    varying vec3 vNormal;
    varying vec3 vWorldPos;
    uniform float uTime;
    uniform float uLevel;
    uniform vec3 uColorInner;
    uniform vec3 uColorOuter;
    void main(){
      vec3 viewDir = normalize(cameraPosition - vWorldPos);
      float fres = pow(1.0 - abs(dot(normalize(vNormal), viewDir)), 2.2);
      float pulse = 0.75 + 0.25*sin(uTime*2.8);
      // iridescence based on angle
      float shift = sin(dot(viewDir, vNormal)*4.0 + uTime);
      vec3 iridescent = uColorInner + vec3(shift*0.15, -shift*0.1, shift*0.2);
      vec3 col = mix(iridescent, uColorOuter, fres);
      col *= pulse * (1.0 + uLevel*1.6);
      col += vec3(1.0, 0.8, 1.0) * fres * 0.4;
      float alpha = 0.88 + fres*0.1;
      gl_FragColor = vec4(col, alpha);
    }
  `,
});

const core = new THREE.Mesh(new THREE.IcosahedronGeometry(1.2, 6), coreMat);
scene.add(core);

// Inner plasma sphere
const plasmaMat = new THREE.MeshBasicMaterial({
  color: 0xff99ff, transparent: true, opacity: 0.45,
  blending: THREE.AdditiveBlending,
});
const plasma = new THREE.Mesh(new THREE.SphereGeometry(0.75, 64, 64), plasmaMat);
scene.add(plasma);

// Outer wireframe halo
const haloMat = new THREE.MeshBasicMaterial({
  color: 0xbb55ff, wireframe: true, transparent: true, opacity: .38,
});
const halo = new THREE.Mesh(new THREE.IcosahedronGeometry(1.55, 3), haloMat);
scene.add(halo);

// ══════════════════════════════════════════════════════════════════════════════
//  Gyroscope Rings — multiple orientations, like an armillary sphere
// ══════════════════════════════════════════════════════════════════════════════
const rings = [];
const ringConfigs = [
  {radius: 2.2,  tube: 0.025, color: 0xcc66ff, axis: 'x', speed: 0.6 },
  {radius: 2.5,  tube: 0.020, color: 0xaa44ff, axis: 'y', speed: -0.8},
  {radius: 2.8,  tube: 0.030, color: 0xdd88ff, axis: 'z', speed: 0.5 },
  {radius: 3.2,  tube: 0.018, color: 0x8833dd, axis: 'xy',speed: -0.4},
  {radius: 3.6,  tube: 0.022, color: 0xff99ff, axis: 'xz',speed: 0.3 },
];

for (const cfg of ringConfigs){
  const geom = new THREE.TorusGeometry(cfg.radius, cfg.tube, 24, 128);
  const mat = new THREE.MeshStandardMaterial({
    color: cfg.color,
    emissive: cfg.color,
    emissiveIntensity: 1.3,
    metalness: 0.85,
    roughness: 0.18,
    transparent: true, opacity: 0.95,
  });
  const mesh = new THREE.Mesh(geom, mat);
  if (cfg.axis === 'y') mesh.rotation.x = Math.PI/2;
  else if (cfg.axis === 'z') mesh.rotation.y = Math.PI/2;
  else if (cfg.axis === 'xy') { mesh.rotation.x = Math.PI/4; mesh.rotation.z = Math.PI/4; }
  else if (cfg.axis === 'xz') { mesh.rotation.x = Math.PI/3; mesh.rotation.y = Math.PI/6; }
  scene.add(mesh);
  rings.push({mesh, speed: cfg.speed, axis: cfg.axis});
}

// ══════════════════════════════════════════════════════════════════════════════
//  Lightning arcs — dynamic electric bolts from core to rings
// ══════════════════════════════════════════════════════════════════════════════
const MAX_ARCS = 6;
const arcs = [];
const arcMat = new THREE.LineBasicMaterial({
  color: 0xff99ff, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending,
});

for (let i=0; i<MAX_ARCS; i++){
  const geom = new THREE.BufferGeometry();
  const pts = new Float32Array(60);  // 20 points * 3 coords
  geom.setAttribute('position', new THREE.BufferAttribute(pts, 3));
  const line = new THREE.Line(geom, arcMat.clone());
  line.material.opacity = 0;
  scene.add(line);
  arcs.push({line, life: 0, target: new THREE.Vector3()});
}

function spawnArc(idx){
  const a = arcs[idx];
  // Random point on outer ring surface
  const theta = Math.random() * Math.PI * 2;
  const phi = (Math.random() - 0.5) * Math.PI * 0.6;
  const r = 2.2 + Math.random() * 1.2;
  a.target.set(
    r * Math.cos(phi) * Math.cos(theta),
    r * Math.sin(phi),
    r * Math.cos(phi) * Math.sin(theta),
  );
  a.life = 1.0;
  updateArcGeometry(a);
  a.line.material.opacity = 0.9;
}

function updateArcGeometry(a){
  const pts = a.line.geometry.attributes.position.array;
  const N = pts.length / 3;
  for (let i=0; i<N; i++){
    const t = i / (N-1);
    const jitter = (1 - Math.abs(t*2 - 1)) * 0.15;  // max jitter in middle
    pts[i*3]   = a.target.x * t + (Math.random()-0.5) * jitter;
    pts[i*3+1] = a.target.y * t + (Math.random()-0.5) * jitter;
    pts[i*3+2] = a.target.z * t + (Math.random()-0.5) * jitter;
  }
  a.line.geometry.attributes.position.needsUpdate = true;
}

// ══════════════════════════════════════════════════════════════════════════════
//  Hexagonal grid floor — reflective feel
// ══════════════════════════════════════════════════════════════════════════════
function makeHexGrid(){
  const size = 40, step = 1.0;
  const verts = [];
  const hexR = step * 0.5;
  const sqrt3 = Math.sqrt(3);
  for (let q = -size; q < size; q++){
    for (let r = -size; r < size; r++){
      const cx = step * 1.5 * q;
      const cz = step * sqrt3 * (r + q/2);
      if (cx*cx + cz*cz > size*size*1.1) continue;
      for (let i=0; i<6; i++){
        const a1 = (i   / 6) * Math.PI * 2;
        const a2 = ((i+1) / 6) * Math.PI * 2;
        verts.push(cx + hexR*Math.cos(a1), 0, cz + hexR*Math.sin(a1));
        verts.push(cx + hexR*Math.cos(a2), 0, cz + hexR*Math.sin(a2));
      }
    }
  }
  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  return geom;
}
const hexGeom = makeHexGrid();
const hexMat = new THREE.LineBasicMaterial({
  color: 0x7733cc, transparent: true, opacity: 0.28,
});
const hexFloor = new THREE.LineSegments(hexGeom, hexMat);
hexFloor.position.y = -5.5;
scene.add(hexFloor);

// ══════════════════════════════════════════════════════════════════════════════
//  Orbital particle system — thousands of glowing dots
// ══════════════════════════════════════════════════════════════════════════════
const PC = 1400;
const pG = new THREE.BufferGeometry();
const pP = new Float32Array(PC*3);
const pV = new Float32Array(PC*3);
const pC = new Float32Array(PC*3);
const pS = new Float32Array(PC);

for (let i=0; i<PC; i++){
  // Spherical distribution around core
  const r = 3 + Math.random() * 7;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2*Math.random() - 1);
  pP[i*3]   = r * Math.sin(phi) * Math.cos(theta);
  pP[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
  pP[i*3+2] = r * Math.cos(phi);

  // Tangential velocity for orbital motion
  pV[i*3]   = -Math.sin(theta) * 0.015;
  pV[i*3+1] = (Math.random() - 0.5) * 0.01;
  pV[i*3+2] =  Math.cos(theta) * 0.015;

  // Color gradient: purple to magenta to pink
  const t = Math.random();
  pC[i*3]   = 0.5 + t * 0.5;   // R
  pC[i*3+1] = 0.1 + t * 0.2;   // G
  pC[i*3+2] = 0.7 + t * 0.3;   // B

  pS[i] = Math.random() * 0.08 + 0.02;
}

pG.setAttribute('position', new THREE.BufferAttribute(pP, 3));
pG.setAttribute('color',    new THREE.BufferAttribute(pC, 3));
pG.setAttribute('size',     new THREE.BufferAttribute(pS, 1));

const particleMat = new THREE.ShaderMaterial({
  uniforms: {uTime: {value: 0}, uLevel: {value: 0}},
  transparent: true, depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    attribute float size;
    varying vec3 vColor;
    uniform float uLevel;
    void main(){
      vColor = color;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = size * (400.0 / -mv.z) * (1.0 + uLevel*0.8);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    void main(){
      vec2 uv = gl_PointCoord - 0.5;
      float d = length(uv);
      if (d > 0.5) discard;
      float a = smoothstep(0.5, 0.0, d);
      a = pow(a, 1.8);
      gl_FragColor = vec4(vColor * a * 2.0, a);
    }
  `,
  vertexColors: true,
});

const particles = new THREE.Points(pG, particleMat);
scene.add(particles);

// ══════════════════════════════════════════════════════════════════════════════
//  Audio-bars equalizer ring
// ══════════════════════════════════════════════════════════════════════════════
const BAR_COUNT = 28;
const EQ_R = 5.0;
const bars3d = [];
for (let i=0; i<BAR_COUNT; i++){
  const geom = new THREE.BoxGeometry(0.1, 0.1, 0.05);
  const mat = new THREE.MeshStandardMaterial({
    color: 0xcc55ff,
    emissive: 0xcc55ff, emissiveIntensity: 2.5,
    transparent: true, opacity: 0.95,
  });
  const m = new THREE.Mesh(geom, mat);
  const a = (i / BAR_COUNT) * Math.PI * 2;
  m.position.set(EQ_R * Math.cos(a), -2.5, EQ_R * Math.sin(a));
  m.lookAt(0, -2.5, 0);
  scene.add(m);
  bars3d.push(m);
}

// ══════════════════════════════════════════════════════════════════════════════
//  Post-processing — Bloom + ChromaticAberration + Film
// ══════════════════════════════════════════════════════════════════════════════
const composer = new EffectComposer(R);
const _dpr = window.devicePixelRatio;
composer.setSize(innerWidth*_dpr, innerHeight*_dpr);
composer.addPass(new RenderPass(scene, cam));

const bloom = new UnrealBloomPass(
  new THREE.Vector2(innerWidth*_dpr, innerHeight*_dpr),
  1.8, 0.42, 0.06,
);
composer.addPass(bloom);

// Chromatic aberration — holographic color fringing
const CA = new ShaderPass({
  uniforms: {tDiffuse:{value:null}, uAmount:{value:0.0022}, uLevel:{value:0}},
  vertexShader: `varying vec2 vUv; void main(){vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float uAmount;
    uniform float uLevel;
    varying vec2 vUv;
    void main(){
      float amt = uAmount * (1.0 + uLevel*1.4);
      vec2 off = (vUv - 0.5) * amt;
      vec3 col;
      col.r = texture2D(tDiffuse, vUv + off).r;
      col.g = texture2D(tDiffuse, vUv).g;
      col.b = texture2D(tDiffuse, vUv - off).b;
      gl_FragColor = vec4(col, 1.0);
    }
  `,
});
composer.addPass(CA);

const film = new FilmPass(0.18, false);
composer.addPass(film);

composer.addPass(new OutputPass());

// ══════════════════════════════════════════════════════════════════════════════
//  Resize handler
// ══════════════════════════════════════════════════════════════════════════════
window.addEventListener('resize', () => {
  const dpr = window.devicePixelRatio;
  cam.aspect = innerWidth/innerHeight;
  cam.updateProjectionMatrix();
  R.setPixelRatio(dpr);
  R.setSize(innerWidth, innerHeight);
  const w = innerWidth*dpr, h = innerHeight*dpr;
  composer.setSize(w, h);
  bloom.resolution.set(w, h);
});

// ══════════════════════════════════════════════════════════════════════════════
//  Animation loop
// ══════════════════════════════════════════════════════════════════════════════
const clock = new THREE.Clock();
const startTime = Date.now();
let nextArcTime = 0;

function frame(){
  requestAnimationFrame(frame);
  const t = clock.getElapsedTime();
  const dt = clock.getDelta();

  // Smooth audio level
  sL = sL + (LEVEL - sL) * 0.1;

  // ── Core ─────────────────────────────────────────────────────────
  coreUniforms.uTime.value = t;
  coreUniforms.uLevel.value = sL;
  core.rotation.y = t * 0.15;
  core.rotation.x = Math.sin(t * 0.2) * 0.3;
  core.scale.setScalar(1 + sL * 0.15);

  plasma.scale.setScalar(1 + Math.sin(t * 3) * 0.08 + sL * 0.2);
  plasma.rotation.y = -t * 0.3;
  plasmaMat.opacity = 0.35 + Math.sin(t * 2.5) * 0.1 + sL * 0.3;

  halo.rotation.x = t * 0.1;
  halo.rotation.y = -t * 0.12;
  halo.scale.setScalar(1 + sL * 0.1);

  // ── Rings (gyroscope motion) ─────────────────────────────────────
  for (const r of rings){
    if (r.axis === 'x')  r.mesh.rotation.x += r.speed * dt;
    else if (r.axis === 'y')  r.mesh.rotation.y += r.speed * dt;
    else if (r.axis === 'z')  r.mesh.rotation.z += r.speed * dt;
    else if (r.axis === 'xy'){r.mesh.rotation.x += r.speed * dt * 0.7; r.mesh.rotation.y += r.speed * dt * 0.5;}
    else if (r.axis === 'xz'){r.mesh.rotation.x += r.speed * dt * 0.6; r.mesh.rotation.z += r.speed * dt * 0.4;}
    r.mesh.material.emissiveIntensity = 1.2 + sL * 2.0 + Math.sin(t * 2 + r.speed) * 0.3;
  }

  // ── Lightning arcs — spawn on audio spikes ──────────────────────
  if (t > nextArcTime || (sL > 0.3 && Math.random() < 0.06)){
    const idx = Math.floor(Math.random() * MAX_ARCS);
    spawnArc(idx);
    nextArcTime = t + 0.5 + Math.random() * 1.2;
  }
  for (const a of arcs){
    if (a.life > 0){
      a.life -= dt * 4;
      a.line.material.opacity = Math.max(0, a.life * 0.9);
      if (Math.random() < 0.4) updateArcGeometry(a);
    }
  }

  // ── Lights orbit ────────────────────────────────────────────────
  keyLight.position.set(Math.sin(t*0.5)*5, 3+Math.cos(t*0.3)*2, Math.cos(t*0.5)*5);
  fillLight.position.set(Math.cos(t*0.7)*4, 2+Math.sin(t*0.4)*2, Math.sin(t*0.7)*4);
  rimLight.intensity = 22 + sL * 40;

  // ── Particles orbit ─────────────────────────────────────────────
  const speedMul = 1 + sL * 2.5;
  for (let i=0; i<PC; i++){
    const idx = i * 3;
    pP[idx]   += pV[idx]   * speedMul;
    pP[idx+1] += pV[idx+1] * speedMul;
    pP[idx+2] += pV[idx+2] * speedMul;
    // Curl: pull back toward sphere
    const d2 = pP[idx]**2 + pP[idx+1]**2 + pP[idx+2]**2;
    if (d2 > 120 || d2 < 8){
      pV[idx]   *= -1; pV[idx+1] *= -1; pV[idx+2] *= -1;
    }
  }
  pG.attributes.position.needsUpdate = true;
  particleMat.uniforms.uTime.value = t;
  particleMat.uniforms.uLevel.value = sL;

  // ── Audio bars ──────────────────────────────────────────────────
  for (let i=0; i<BAR_COUNT; i++){
    const target = BARS[i] || 0;
    const h = 0.1 + target * 4.5;
    bars3d[i].scale.y = bars3d[i].scale.y + (h - bars3d[i].scale.y) * 0.18;
    bars3d[i].material.emissiveIntensity = 2 + target * 4;
  }

  // ── Camera subtle sway ──────────────────────────────────────────
  cam.position.x = Math.sin(t * 0.12) * 0.6;
  cam.position.y = 2.2 + Math.sin(t * 0.18) * 0.3;
  cam.lookAt(0, 0, 0);

  // ── Post-processing reactivity ──────────────────────────────────
  bloom.strength = 1.6 + sL * 1.4;
  CA.uniforms.uLevel.value = sL;

  composer.render();
}
frame();

// ══════════════════════════════════════════════════════════════════════════════
//  HUD UI updates
// ══════════════════════════════════════════════════════════════════════════════
const stateBadge = document.getElementById('state-badge');
const topTime = document.getElementById('top-time');
const topCenterEl = document.getElementById('top-center');

function pad2(n){return n<10?'0'+n:''+n}
function updateClock(){
  const d = new Date();
  topTime.textContent = pad2(d.getHours())+':'+pad2(d.getMinutes())+':'+pad2(d.getSeconds());
  // Uptime
  const up = Date.now() - startTime;

  const m = Math.floor((up % 3600000) / 60000);
  const s = Math.floor((up % 60000) / 1000);
  document.getElementById('w-uptime').textContent = pad2(h)+':'+pad2(m)+':'+pad2(s);
}
setInterval(updateClock, 500); updateClock();

// Fake telemetry animation

// Data stream characters
function genStream(){

// ── State badge ─────────────────────────────────────────────────
const stateNames = {idle:'STANDBY', listening:'HÖRT ZU', thinking:'ANALYSIERT', speaking:'SPRICHT'};
let prevState = '', prevMsgCount = -1;

function renderConv(msgs, state){
  typingEl.classList.toggle('on', state === 'thinking');
  let h = '';
  for (const m of msgs){
    const role = (m.role || '').toLowerCase();
    const old = m.age > 15 ? ' old' : '';
    h += `<div class="msg${old}"><span class="msg-role ${role}">${m.role||''}</span><span class="msg-text">${(m.text||'').replace(/</g,'&lt;')}</span></div>`;
  }
  convEl.innerHTML = `<div id="typing"${state==='thinking'?' class="on"':''}>
    <span class="td"></span><span class="td"></span><span class="td"></span>
    <span id="typing-label">VERARBEITE</span>
  </div>` + h;
}

// ══════════════════════════════════════════════════════════════════════════════
//  Data poll
// ══════════════════════════════════════════════════════════════════════════════
async function poll(){
  try{
    const r = await fetch('/data');
    if (r.ok){
      const d = await r.json();
      if (d.state) STATE = d.state;
      if (typeof d.level === 'number') LEVEL = d.level;
      if (Array.isArray(d.bars) && d.bars.length === 28) BARS = d.bars;
      if (Array.isArray(d.msgs)) MSGS = d.msgs;
      if (d.user && !USERNAME){
        USERNAME = d.user;
        topCenterEl.textContent = 'WILLKOMMEN, SIR '+USERNAME;
      }
    }
  }catch(_){}

  // Update state badge
  const sn = stateNames[STATE] || STATE.toUpperCase();
  if (sn !== stateBadge.textContent){
    stateBadge.textContent = sn;
    document.getElementById('w-state').textContent = sn;
  }

  // Update audio level widget
  const pct = Math.round(LEVEL * 100);
  document.getElementById('w-audio-in').textContent = pct + '%';
  document.getElementById('bar-audio').style.width = pct + '%';
  document.getElementById('listen-bar').style.width = pct + '%';

  // Output meter (inverse of audio — pulses opposite)
  const outPct = Math.round((0.5 + Math.sin(Date.now()*0.003)*0.15 + LEVEL*0.3) * 100);
  document.getElementById('w-output').textContent = outPct + '%';
  document.getElementById('bar-output').style.width = outPct + '%';

  // Messages
  if (MSGS.length !== prevMsgCount || STATE !== prevState){
    prevMsgCount = MSGS.length; prevState = STATE;
    renderConv(MSGS, STATE);
  }

  setTimeout(poll, 100);
}
poll();

// ══════════════════════════════════════════════════════════════════════════════
//  Chat input + microphone
// ══════════════════════════════════════════════════════════════════════════════
const chatInput = document.getElementById('chat-input');
const btnSend   = document.getElementById('btn-send');
const btnMic    = document.getElementById('btn-mic');
let mediaRec = null, audioChunks = [];

async function sendText(){
  const text = chatInput.value.trim();
  if (!text) return;
  chatInput.value = '';
  chatInput.disabled = true; btnSend.disabled = true;
  try{
    await fetch('/ask', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({text}),
    });
  }catch(e){console.error(e)}
  chatInput.disabled = false; btnSend.disabled = false;
  chatInput.focus();
}
btnSend.addEventListener('click', sendText);
chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendText(); });

btnMic.addEventListener('click', async () => {
  if (mediaRec && mediaRec.state === 'recording'){ mediaRec.stop(); return; }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio: true});
    mediaRec = new MediaRecorder(stream, {mimeType: 'audio/webm;codecs=opus'});
    audioChunks = [];
    mediaRec.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRec.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      btnMic.classList.remove('recording');
      if (!audioChunks.length) return;
      const blob = new Blob(audioChunks, {type: 'audio/webm'});
      chatInput.disabled = true;
      try{
        await fetch('/voice', {
          method: 'POST',
          headers: {'Content-Type':'audio/webm'},
          body: blob,
        });
      }catch(e){console.error(e)}
      chatInput.disabled = false;
    };
    mediaRec.start();
    btnMic.classList.add('recording');
  }catch(e){console.error('Kein Mikrofon:',e)}
});

function goFS(){
  const el = document.documentElement;
  const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen;
  if (fn) fn.call(el).catch(() => {});
}

document.addEventListener('click', goFS, {once: true});
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) setTimeout(goFS, 400);
});
